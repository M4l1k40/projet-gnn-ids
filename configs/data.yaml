paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  processed_v3: data/processed_v3
  processed_v3_logz: data/processed_v3_logz
  scaler_v3_logz: models/scaler_v3_logz.joblib
  p2_folds_source: data/processed/p2_folds.parquet
  scaler_audit_v3: reports/scaler_audit/feature_audit_v3.csv
  normalization_v3_logz_report: reports/normalization_v3_logz.md
  feature_list: models/features.json
  scaler_v3: models/scaler_v3.joblib
  attack_windows: configs/attack_windows.yaml
  split_v3_report: reports/split_v3.md
  normalization_v3_report: reports/normalization_v3.md

split:
  train: 0.60
  validation: 0.15
  test: 0.25
  gap_minutes: 5
  mode: count
  min_flows_per_block: 100
  variants:
    segment:
      gap_minutes: 4
    blocks:
      block_minutes: 10
      gap_minutes: 4
  final:
    variant: segment
    gap_minutes: 3
    min_flows_per_block: 50
    benign_ownership: class_range

normalization:
  method: standard

normalization_logz:
  batch_size: 50000
  sample_size: 200000
  sample_seed: 42
  invalid_negative_features:
    - Flow Duration
    - Flow Bytes/s
    - Flow Packets/s
    - Flow IAT Mean
    - Flow IAT Std
    - Flow IAT Max
    - Flow IAT Min
    - Fwd IAT Total
    - Fwd IAT Mean
    - Fwd IAT Std
    - Fwd IAT Max
    - Fwd IAT Min
    - Bwd IAT Total
    - Bwd IAT Mean
    - Bwd IAT Std
    - Bwd IAT Max
    - Bwd IAT Min
    - Fwd Packets/s
    - Bwd Packets/s
    - Fwd Header Length
    - Bwd Header Length
    - min_seg_size_forward

leakage:
  test_sample: 50000
  train_sample: 300000

seeds:
  split: 42
  model: 42
  global: 42

fake:
  n_days: 5
  flows_per_day: 2000
  n_features: 20
  benign_ratio: 0.95
  classes: [BENIGN, DoS, PortScan, BruteForce, WebAttack, RareAttack]

raw_subdir: GeneratedLabelledFlows/TrafficLabelling

timestamps:
  formats:
    Monday: "%d/%m/%Y %H:%M:%S"
    other: "%d/%m/%Y %H:%M"
  pm_hour_threshold: 8

cv:
  k: 5
  purge_minutes: 3
