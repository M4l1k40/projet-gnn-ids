paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed

split:
  train: 0.60
  validation: 0.15
  test: 0.25
  gap_minutes: 5
  mode: count
  min_flows_per_block: 100
  variants:
    segment:
      gap_minutes: 4
    blocks:
      block_minutes: 10
      gap_minutes: 4

seeds:
  split: 42
  model: 42
  global: 42

fake:
  n_days: 5
  flows_per_day: 2000
  n_features: 20
  benign_ratio: 0.95
  classes: [BENIGN, DoS, PortScan, BruteForce, WebAttack, RareAttack]

raw_subdir: GeneratedLabelledFlows/TrafficLabelling

timestamps:
  formats:
    Monday: "%d/%m/%Y %H:%M:%S"
    other: "%d/%m/%Y %H:%M"
  pm_hour_threshold: 8
